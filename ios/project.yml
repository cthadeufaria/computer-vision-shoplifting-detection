name: ShopliftDetect
options:
  bundleIdPrefix: com.shopliftdetect
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  swift: "6.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_STRICT_OBJC_MSGSEND: YES

targets:
  ShopliftDetect:
    type: application
    platform: iOS
    sources:
      - path: ShopliftDetect
        excludes:
          - "**/*.md"
    resources:
      - path: ShopliftDetect/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopliftdetect.app
        INFOPLIST_FILE: ShopliftDetect/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - sdk: Vision.framework
      - sdk: AVFoundation.framework
      - sdk: CoreML.framework

  ShopliftDetectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShopliftDetectTests
        excludes:
          - "Fixtures/**"
    resources:
      - path: ShopliftDetectTests/Fixtures/coco17_sample.json
      - path: ShopliftDetectTests/Fixtures/normal_pose_window.json
      - path: ShopliftDetectTests/Fixtures/inference_nll_sample.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopliftdetect.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ShopliftDetect.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ShopliftDetect"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: ShopliftDetect

  ShopliftDetectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShopliftDetectUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shopliftdetect.uitests
        TEST_TARGET_NAME: ShopliftDetect
    dependencies:
      - target: ShopliftDetect
